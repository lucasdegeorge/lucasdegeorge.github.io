<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="icon" type="image/svg+xml" href="{{ '/favicon.svg' | relative_url }}?v=2">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/favicon-32.png' | relative_url }}?v=2">
  <link rel="apple-touch-icon" href="{{ '/apple-touch-icon.png' | relative_url }}?v=2">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  {% for css in page.extra_css %}
  <link rel="stylesheet" href="{% if css contains '://' %}{{ css }}{% else %}{{ css | relative_url }}{% endif %}">
  {% endfor %}
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
  {% seo %}
</head>
<body>
  {% include header.html %}
  
  <main class="container">
    {{ content }}
  </main>
  
  {% include footer.html %}
  
  <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
  {% for js in page.extra_js %}
  <script defer src="{% if js contains '://' %}{{ js }}{% else %}{{ js | relative_url }}{% endif %}"></script>
  {% endfor %}
</body>
</html>
